# APIService registration for the aggregated simple-apiserver.
#
# !!! This file is a TEMPLATE !!!
#   * ${CA_BUNDLE_B64} is substituted by hack/e2e-up.sh with the base64
#     PEM of the CA that signed the serving cert held in the
#     simple-apiserver-tls Secret.
#   * Apply it directly with `kubectl apply -f` and you will get a hard
#     error from the API server (caBundle must be valid base64). That
#     is intentional: there is no skeleton-mode shortcut anymore.
#
# Registers tasks.example.com/v1alpha1 with the kube-aggregator so that
# requests to /apis/tasks.example.com/v1alpha1/... on the front-proxy
# kube-apiserver are forwarded to this server.
#
# The companion Service + Deployment live under manifests/e2e/ — kept
# separate so the APIService stays a single self-contained registration.
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.tasks.example.com
spec:
  group: tasks.example.com
  version: v1alpha1
  groupPriorityMinimum: 1000
  versionPriority: 15
  service:
    name: simple-apiserver
    namespace: simple-apiserver
    port: 443
  # Base64-encoded PEM of the CA that signed the Service's serving cert.
  # Substituted in by hack/e2e-up.sh from .local-run/e2e-certs/ca.crt.
  caBundle: ${CA_BUNDLE_B64}
