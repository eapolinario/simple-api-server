# Deployment + Service for the aggregated apiserver in the e2e cluster.
#
# Image is `simple-apiserver:e2e` — built by `docker build` and loaded
# into the kind cluster with `kind load docker-image`. imagePullPolicy is
# IfNotPresent so kind uses the loaded image without trying to pull from
# a registry.
#
# Serving cert: mounted read-only from the `simple-apiserver-tls`
# Secret created by hack/e2e-up.sh. The Secret is of type kubernetes.io/tls,
# so it exposes tls.crt and tls.key at the mount path. The apiserver's
# --tls-cert-file / --tls-private-key-file flags point at those files
# directly; --cert-dir is unused in this mode (no auto-generation).
# APIService.spec.caBundle is populated with the matching CA so the
# aggregator can verify the chain end-to-end — no insecureSkipTLSVerify
# anywhere.
#
# Auth flags: nothing extra here. cmd-main defaults to delegating
# authn/authz when --authorization-mode is empty, which is exactly what
# we want in-cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-apiserver
  namespace: simple-apiserver
  labels:
    app.kubernetes.io/name: simple-apiserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: simple-apiserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: simple-apiserver
    spec:
      serviceAccountName: simple-apiserver
      containers:
        - name: apiserver
          image: simple-apiserver:e2e
          imagePullPolicy: IfNotPresent
          args:
            - --secure-port=6443
            - --tls-cert-file=/var/run/simple-apiserver/certs/tls.crt
            - --tls-private-key-file=/var/run/simple-apiserver/certs/tls.key
          ports:
            - name: https
              containerPort: 6443
              protocol: TCP
          # Read-only mount of the kubernetes.io/tls Secret that holds
          # the CA-signed serving cert. The Secret is created by
          # hack/e2e-up.sh from .local-run/e2e-certs/.
          volumeMounts:
            - name: serving-cert
              mountPath: /var/run/simple-apiserver/certs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: serving-cert
          secret:
            secretName: simple-apiserver-tls
---
# Service that the aggregator points at. Port 443 → container 6443 keeps
# the APIService spec.service.port: 443 (kube-apiserver's default
# expectation) without forcing the container to bind a privileged port.
apiVersion: v1
kind: Service
metadata:
  name: simple-apiserver
  namespace: simple-apiserver
  labels:
    app.kubernetes.io/name: simple-apiserver
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: simple-apiserver
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
