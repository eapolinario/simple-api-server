# Deployment + Service for the aggregated apiserver in the e2e cluster.
#
# Image is `simple-apiserver:e2e` — built by `docker build` and loaded
# into the kind cluster with `kind load docker-image`. imagePullPolicy is
# IfNotPresent so kind uses the loaded image without trying to pull from
# a registry.
#
# Serving cert: we let the server auto-generate a self-signed serving
# cert into /var/run/simple-apiserver/certs on startup (the
# k8s.io/apiserver SecureServingOptions does this when --cert-dir is set
# and no cert exists). The APIService has insecureSkipTLSVerify: true
# specifically so this works without cert-manager / CA wiring. This is
# the deliberate skeleton shortcut documented in apiservice.yaml and
# tracked under the e2e-tls follow-up todo.
#
# Auth flags: nothing extra here. cmd-main defaults to delegating
# authn/authz when --authorization-mode is empty, which is exactly what
# we want in-cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-apiserver
  namespace: simple-apiserver
  labels:
    app.kubernetes.io/name: simple-apiserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: simple-apiserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: simple-apiserver
    spec:
      serviceAccountName: simple-apiserver
      containers:
        - name: apiserver
          image: simple-apiserver:e2e
          imagePullPolicy: IfNotPresent
          args:
            - --secure-port=6443
            - --cert-dir=/var/run/simple-apiserver/certs
          ports:
            - name: https
              containerPort: 6443
              protocol: TCP
          # distroless/static:nonroot runs as uid 65532. /var/run is
          # writable on tmpfs in pods by default, but the subdir is not
          # — mount an emptyDir so the auto-generated cert has somewhere
          # to land without needing root.
          volumeMounts:
            - name: cert-dir
              mountPath: /var/run/simple-apiserver/certs
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: cert-dir
          emptyDir: {}
---
# Service that the aggregator points at. Port 443 → container 6443 keeps
# the APIService spec.service.port: 443 (kube-apiserver's default
# expectation) without forcing the container to bind a privileged port.
apiVersion: v1
kind: Service
metadata:
  name: simple-apiserver
  namespace: simple-apiserver
  labels:
    app.kubernetes.io/name: simple-apiserver
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: simple-apiserver
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
